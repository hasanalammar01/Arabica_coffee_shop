<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Arabica menu admin</title>
    <link rel="icon" href="/icon.svg" />
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script
      src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"
      integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <script>
      // The GitHub repository that holds this site; the admin commits menu changes to it.
      const REPO = "hasanalammar01/Arabica_coffee_shop";

      const TAGS = [
        { label: "Vegan", value: "vegan" },
        { label: "Gluten-free", value: "gluten-free" },
        { label: "Spicy", value: "spicy" },
        { label: "New", value: "new" },
        { label: "Bestseller", value: "bestseller" },
      ];

      CMS.init({
        config: {
          load_config_file: false,
          // On your computer, `npm run cms` lets you edit local files with no login.
          local_backend: ["localhost", "127.0.0.1"].includes(location.hostname),
          backend: {
            name: "github",
            repo: REPO,
            branch: "main",
            base_url: location.origin, // login is handled by /api/decap/* on this site
            auth_endpoint: "api/decap/auth",
          },
          site_url: location.origin,
          display_url: location.origin,
          media_folder: "public/menu",
          public_folder: "/menu",
          collections: [
            {
              name: "menu",
              label: "Menu",
              editor: { preview: false },
              files: [
                {
                  name: "menu",
                  label: "Menu",
                  file: "data/menu.json",
                  fields: [
                    {
                      name: "categories",
                      label: "Sections",
                      label_singular: "section",
                      widget: "list",
                      summary: "{{fields.name}}",
                      collapsed: true,
                      hint: "Drag sections to change their order on the site. Empty sections stay hidden.",
                      fields: [
                        { name: "name", label: "Section name", widget: "string", hint: "e.g. Breakfast" },
                        {
                          name: "items",
                          label: "Items",
                          label_singular: "item",
                          widget: "list",
                          summary: "{{fields.name}} — {{fields.price}}",
                          collapsed: true,
                          fields: [
                            { name: "name", label: "Name", widget: "string" },
                            {
                              name: "price",
                              label: "Price (L.L)",
                              widget: "number",
                              value_type: "int",
                              min: 1,
                              required: false,
                              hint: "Numbers only, e.g. 400000. Leave empty if you use sizes below.",
                            },
                            {
                              name: "description",
                              label: "Description",
                              widget: "string",
                              required: false,
                            },
                            {
                              name: "image",
                              label: "Photo",
                              widget: "image",
                              required: false,
                              hint: "Optional. Cut-out photos on a transparent background look best.",
                            },
                            {
                              name: "options",
                              label: "Flavours / choices",
                              label_singular: "choice",
                              widget: "list",
                              required: false,
                              field: { name: "option", label: "Choice", widget: "string" },
                              hint: "Choices that don't change the price, e.g. Peach, Lemon.",
                            },
                            {
                              name: "sizes",
                              label: "Sizes",
                              label_singular: "size",
                              widget: "list",
                              required: false,
                              summary: "{{fields.size}} — {{fields.price}}",
                              hint: "Only if the price depends on size. Replaces the price above.",
                              fields: [
                                { name: "size", label: "Size", widget: "string" },
                                { name: "price", label: "Price (L.L)", widget: "number", value_type: "int", min: 1 },
                              ],
                            },
                            {
                              name: "tags",
                              label: "Tags",
                              widget: "select",
                              multiple: true,
                              required: false,
                              options: TAGS,
                            },
                            {
                              name: "addon",
                              label: "Extra / add-on (e.g. Add cheese)",
                              widget: "boolean",
                              required: false,
                              default: false,
                            },
                          ],
                        },
                      ],
                    },
                  ],
                },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
